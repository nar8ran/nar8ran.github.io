<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- TODO: サイト名・説明を差し替え -->
    <title>なろ — Portfolio</title>
    <meta
      name="description"
      content="一次創作とVTuber向けの創作活動をしているクリエイターのポートフォリオサイトです。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="home bg-paper">
      <!-- ============ ヒーロー（CSSアニメーション・無限ループ） ============
           画像や動画は使っていません。色は style.css の :root、
           動きは style.css の「ヒーロー」セクションで調整できます。
           あとでイラストを入れたい場合は、この <section> の中に
           <img class="hero__art" src="images/xxx.png" alt="" /> を足せばOKです。 -->
      <section class="hero" id="hero" aria-hidden="true">
        <!-- 背景で漂う光 -->
        <span class="orb orb--1"></span>
        <span class="orb orb--2"></span>
        <span class="orb orb--3"></span>
        <span class="orb orb--4"></span>

        <!-- 中央の回る輪と、その軌道をめぐる粒 -->
        <span class="ring ring--1"></span>
        <span class="ring ring--2"></span>
        <span class="ring ring--dash"></span>
        <span class="orbit orbit--1"><i class="satellite satellite--sage"></i></span>
        <span class="orbit orbit--2"><i class="satellite satellite--blush"></i></span>
        <span class="orbit orbit--3"><i class="satellite satellite--white"></i></span>

        <!-- ふわふわ回る図形 -->
        <span class="shape shape--circle"></span>
        <span class="shape shape--tri"></span>
        <span class="shape shape--square"></span>

        <span class="twinkle twinkle--1">✦</span>
        <span class="twinkle twinkle--2">✧</span>
        <span class="twinkle twinkle--3">✦</span>

        <!-- 流れる文字 -->
        <div class="hero__ticker">
          <div class="hero__ticker-track">
            <span>Illustration ・ Live2D ・ Animation ・ Music ・ Design ・&nbsp;</span>
            <span>Illustration ・ Live2D ・ Animation ・ Music ・ Design ・&nbsp;</span>
          </div>
        </div>
      </section>

      <!-- ============ 右サイドのナビ ============ -->
      <aside class="home-side">
        <div class="home-brand">
          <a href="index.html">
            <!-- TODO: お名前・肩書き -->
            <div class="home-brand__name">なろ</div>
            <div class="home-brand__role">Creator / Illustrator</div>
          </a>
        </div>

        <nav class="home-nav">
          <a href="about.html">About</a>
          <a href="works.html">Works</a>
          <a href="contact.html">Contact</a>
        </nav>

        <div class="home-links">
          <div class="home-links__label">Links</div>
          <!-- TODO: href を実際のURLに。使わないリンクは行ごと削除してください -->
          <nav class="home-links__list">
            <a href="#" target="_blank" rel="noreferrer">Commission</a>
            <a href="#" target="_blank" rel="noreferrer">Link</a>
            <a href="#" target="_blank" rel="noreferrer">X</a>
          </nav>
        </div>
      </aside>
    </main>

    <script src="script.js"></script>
  </body>
</html>
